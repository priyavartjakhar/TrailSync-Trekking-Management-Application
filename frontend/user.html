<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrailSync — Trekker Dashboard</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap CSS (required by project spec) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- TrailSync Trekker Dashboard CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/user_style.css') }}" />

  <style>
    /* Bootstrap reset overrides — prevent Bootstrap from conflicting with our layout */
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; padding: 0; }
  </style>
</head>
<body>

  <!-- Vue App Mount Point -->
  <div id="app">
    <ts-user-layout @logout="handleLogout"></ts-user-layout>
  </div>

  <!-- Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <!-- Bootstrap JS Bundle (required by project spec) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- TrailSync Trekker JS: data → components → app (order matters) -->
  <script src="{{ url_for('static', filename='js/user_data.js') }}"></script>
  <script src="{{ url_for('static', filename='js/user_components.js') }}"></script>
  <script src="{{ url_for('static', filename='js/user_app.js') }}"></script>

</body>
</html>
